[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "elfresolver"
version = "0.1.0"
description = "Find symbols in stripped ELF binaries by what they call and reference, with a headless IDA."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ariel Verbin" }]
# None: IDA's side runs on IDA's own Python, and demangling comes from IDA.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyelftools>=0.33",
]

[tool.setuptools.packages.find]
include = ["elfresolver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test the checked-out sources, even when an older version is installed.
pythonpath = ["."]
markers = ["ida: needs a local IDA installation (pass it with $IDADIR)"]
